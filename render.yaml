# Render Blueprint — https://render.com/docs/blueprint-spec
# Deploy: connect this repo in the Render dashboard as a Blueprint, or run
#   render blueprint launch
# Secrets (marked sync: false) must be filled in via the Render dashboard —
# never commit real values for these.

services:
  - type: web
    name: ai-widget-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: starter
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: CLIENT_URL
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_EMBEDDING_MODEL
        value: text-embedding-3-small
      - key: OPENAI_CHAT_MODEL
        value: gpt-4.1
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        sync: false
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: MAX_FILE_SIZE_MB
        value: 20
      - key: UPLOAD_DIR
        value: uploads
      - key: RATE_LIMIT_WINDOW_MS
        value: 900000
      - key: RATE_LIMIT_MAX
        value: 100
      - key: VECTOR_SEARCH_INDEX
        value: vector_index
      - key: VECTOR_SEARCH_NUM_CANDIDATES
        value: 100
      - key: VECTOR_SEARCH_LIMIT
        value: 5
      - key: SIMILARITY_THRESHOLD
        value: 0.75
      - key: WIDGET_ALLOWED_ORIGINS
        sync: false
    disk:
      name: uploads
      mountPath: /app/uploads
      sizeGB: 1
